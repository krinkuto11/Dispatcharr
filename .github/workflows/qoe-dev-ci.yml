name: QoE fork CI

on:
  push:
    branches: [feat/qoe-observability, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qoe-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r qoe/ci-test-requirements.txt
      - name: Check core and exporter syntax
        run: |
          python -m compileall -q apps/proxy/live_proxy qoe/iptv_qoe_exporter qoe/probe scripts/qoe_release_sync.py
      - name: Run Dispatcharr live-output tests
        env:
          DJANGO_SECRET_KEY: qoe-ci-test-only
        run: |
          python manage.py test \
            apps.proxy.live_proxy.tests.test_delivery_diagnostics \
            apps.proxy.live_proxy.tests.test_delivery_generators \
            apps.proxy.live_proxy.tests.test_delivery_hls_events \
            apps.proxy.live_proxy.tests.test_ffmpeg_diagnostics \
            apps.proxy.live_proxy.tests.test_output_buffer_missing \
            apps.proxy.live_proxy.tests.test_hls_views \
            apps.proxy.live_proxy.tests.test_output_profile_restart \
            apps.proxy.live_proxy.tests.test_stream_ts_client_registration \
            apps.proxy.live_proxy.tests.test_ts_generator_release --noinput
      - name: Run exporter and synthetic decoder tests
        run: |
          python -m unittest discover -s qoe/iptv_qoe_exporter -p 'test_*.py'
          python -m unittest discover -s qoe/probe -p 'test_probe*.py'

  images:
    needs: qoe-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Dispatcharr fork image
        run: |
          docker build --file docker/Dockerfile \
            --build-arg REPO_OWNER=dispatcharr \
            --build-arg REPO_NAME=dispatcharr \
            --build-arg BASE_TAG=base \
            --tag dispatcharr-qoe-ci:${{ github.sha }} .
      - name: Build decoder probe image
        run: docker build --file qoe/probe/Dockerfile --tag dispatcharr-qoe-probe-ci:${{ github.sha }} qoe/probe
